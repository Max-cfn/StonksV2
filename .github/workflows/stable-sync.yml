name: Sync stable release

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: stable-release-sync
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: Cloeille/picsou-finance

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check latest stable release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api "repos/$UPSTREAM_REPOSITORY/releases/latest" --jq .tag_name)
          git remote add upstream "https://github.com/$UPSTREAM_REPOSITORY.git"
          git fetch upstream "refs/tags/$tag:refs/tags/$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          if git merge-base --is-ancestor "$tag" HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              git push origin "refs/tags/$tag"
              gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
                --title "$tag" --notes "Based on Picsou Finance $tag."
            fi
          else
            title="Stable sync $tag needs review"
            branch="automation/stable-$tag"
            pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&head=$GITHUB_REPOSITORY_OWNER:$branch" \
              --jq '.[0].number // empty')
            if test -n "$pr"; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "resume=true" >> "$GITHUB_OUTPUT"
              echo "branch=$branch" >> "$GITHUB_OUTPUT"
              echo "pr=$pr" >> "$GITHUB_OUTPUT"
              echo "Resuming pull request $pr for $tag."
            elif gh api "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" \
              --jq '.[].title' | grep -Fxq "$title"; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "Review issue already open for $tag."
            else
              echo "changed=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Prepare stable update
        if: steps.release.outputs.changed == 'true'
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          branch="automation/stable-$TAG"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git switch -c "$branch"

          if ! git merge --no-ff "$TAG" -m "chore: sync $TAG"; then
            conflicts=$(git diff --name-only --diff-filter=U)
            git merge --abort
            title="Stable sync $TAG needs review"
            body=$(printf 'The stable release cannot be merged automatically.\n\nConflicts:\n```\n%s\n```\n\nRun: %s/actions/runs/%s' \
              "$conflicts" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues" \
              -f title="$title" -f body="$body" >/dev/null || true
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Stable release $TAG needs manual review."
            exit 0
          fi

          git push --force-with-lease origin "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Open and validate pull request
        if: steps.update.outputs.ready == 'true' || steps.release.outputs.resume == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          BRANCH: ${{ steps.update.outputs.branch || steps.release.outputs.branch }}
          EXISTING_PR: ${{ steps.release.outputs.pr }}
        run: |
          pr="$EXISTING_PR"
          if test -z "$pr"; then
            if ! pr=$(gh api --method POST "repos/$GITHUB_REPOSITORY/pulls" \
              -f base=main -f head="$BRANCH" \
              -f title="chore: sync $TAG" \
              -f body="Stable upstream release: $TAG." --jq .number); then
              echo "::warning::GitHub refused pull request creation for $TAG."
              exit 0
            fi
          fi

          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
          sha=$(git rev-parse HEAD)
          run_id=""
          for _ in {1..12}; do
            run_id=$(gh run list --repo "$GITHUB_REPOSITORY" \
              --workflow ci.yml --branch "$BRANCH" \
              --event workflow_dispatch --limit 10 \
              --json databaseId,headSha \
              --jq "map(select(.headSha == \"$sha\"))[0].databaseId // empty")
            test -n "$run_id" && break
            sleep 5
          done

          if test -z "$run_id" || ! gh run watch "$run_id" \
            --repo "$GITHUB_REPOSITORY" --exit-status; then
            echo "::warning::CI needs review for $TAG."
            exit 0
          fi

          merged=$(gh api --method PUT "repos/$GITHUB_REPOSITORY/pulls/$pr/merge" \
            -f merge_method=merge --jq .merged)
          if test "$merged" = true; then
            git push origin --delete "$BRANCH"
          else
            echo "::warning::Pull request $pr is ready but was not merged."
          fi
