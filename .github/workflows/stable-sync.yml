name: Sync stable release

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: stable-release-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check latest stable release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api repos/Zoeille/picsou-finance/releases/latest --jq .tag_name)
          git remote add upstream https://github.com/Zoeille/picsou-finance.git
          git fetch upstream "refs/tags/$tag:refs/tags/$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          if git merge-base --is-ancestor "$tag" HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              git push origin "refs/tags/$tag"
              gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
                --title "$tag" --notes "Based on Picsou Finance $tag."
            fi
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare stable update
        if: steps.release.outputs.changed == 'true'
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          branch="automation/stable-${TAG}-${GITHUB_RUN_ID}"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git switch -c "$branch"

          if ! git merge --no-ff "$TAG" -m "chore: sync $TAG"; then
            git merge --abort
            title="Stable sync $TAG failed"
            if ! gh issue list --state open --search "${title} in:title" \
              --json title --jq '.[].title' | grep -Fxq "$title"; then
              gh issue create --title "$title" \
                --body "The daily merge of Picsou Finance $TAG has conflicts."
            fi
            exit 1
          fi

          git push origin "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Open and validate pull request
        if: steps.release.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          BRANCH: ${{ steps.update.outputs.branch }}
        run: |
          pr=$(gh pr create --base main --head "$BRANCH" \
            --title "chore: sync $TAG" \
            --body "Stable upstream release: $TAG.")
          gh workflow run ci.yml --ref "$BRANCH"
          gh pr merge "$pr" --auto --merge --delete-branch
